name: validate-skills
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<"PY"
          import os, sys, re
          bad = []
          count = 0
          for root, dirs, files in os.walk("skills"):
              if "SKILL.md" in files:
                  count += 1
                  p = os.path.join(root, "SKILL.md")
                  txt = open(p, encoding="utf-8", errors="replace").read()
                  m = re.match(r"^---\s*(.*?)\s*---", txt, re.S)
                  if not m:
                      bad.append(p + " :: missing frontmatter"); continue
                  fm = m.group(1)
                  if "name:" not in fm: bad.append(p + " :: missing name")
                  if "description:" not in fm: bad.append(p + " :: missing description")
          print("checked:", count, "skills")
          if bad:
              print("\n".join(bad[:50]))
              print("total problems:", len(bad))
              sys.exit(1)
          PY