name: validate-skills
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md frontmatter
        run: |
          fail=0
          n=0
          for f in $(find skills -name SKILL.md); do
            n=$((n+1))
            head -8 "$f" | grep -q '^name:' || { echo "missing name: $f"; fail=1; }
            head -15 "$f" | grep -q '^description:' || { echo "missing description: $f"; fail=1; }
          done
          echo "checked $n skills"
          exit $fail
